[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-bf16"
version = "0.1.0"
description = "Official LangChain integration for bf16.ai (1M-context uncensored open-weight LLMs with Zero Data Retention)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "BF16 Team", email = "hello@bf16.ai"}]
keywords = ["langchain", "bf16", "llm", "uncensored", "ai", "deepseek", "glm", "kimi", "zdr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["langchain-openai>=0.2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://bf16.ai"
Documentation = "https://bf16.ai/docs"
Repository = "https://github.com/BF16-AI/langchain-bf16"
"Model Catalog" = "https://bf16.ai/models"
"Open-Source Grants" = "https://bf16.ai/open-source"

[tool.setuptools.packages.find]
include = ["langchain_bf16*"]
